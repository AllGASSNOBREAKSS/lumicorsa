[ABOUT]
NAME = Lumicorsa
AUTHOR = Lumicorsa contributors
VERSION = 2.0.1
DESCRIPTION = Light for Assetto Corsa: photoreal look, analog cluster HUD and every graphics, camera, drive, audio and sky setting in one panel. Needs only Content Manager + CSP. Works online and offline.
REQUIRED_VERSION = 3000
URL = https://github.com/AllGASSNOBREAKSS/lumicorsa

[CORE]
; NONE: load with the session so the look and the HUD run without opening the panel
LAZY = NONE

[WINDOW_...]
ID = dashboard
NAME = Lumicorsa
ICON = icon.png
FUNCTION_MAIN = windowDashboard
SIZE = 1480, 940
PADDING = 0, 0
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_RESIZE

[WINDOW_...]
ID = hud
NAME = Lumicorsa HUD
ICON = icon.png
FUNCTION_MAIN = windowHud
SIZE = 588, 302
PADDING = 0, 0
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, NO_RESIZE, NO_COLLAPSE
