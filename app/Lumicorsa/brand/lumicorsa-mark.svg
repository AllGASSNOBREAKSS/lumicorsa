<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    @keyframes sweep{0%{stroke-dashoffset:220}55%,100%{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.22)}}
    @keyframes ring{to{transform:rotate(360deg)}}
    .s{stroke-dasharray:220;animation:sweep 2.8s cubic-bezier(.7,0,.2,1) infinite}
    .p{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
    .r{transform-origin:60px 60px;animation:ring 14s linear infinite}
  </style>
  <rect x="2" y="2" width="116" height="116" rx="30" fill="#0B0B0E" stroke="#2C2C34"/>
  <g class="r"><circle cx="60" cy="60" r="40" fill="none" stroke="#33333B" stroke-width="2" stroke-dasharray="4 8"/></g>
  <g stroke="#3B3B45" stroke-width="2" fill="none"><path d="M60 20 L86 46"/><path d="M100 60 L74 86"/><path d="M60 100 L34 74"/><path d="M20 60 L46 34"/></g>
  <path class="s" d="M22 94 C 44 92, 50 62, 60 56 S 86 30, 100 26" fill="none" stroke="#FFB547" stroke-width="7" stroke-linecap="round"/>
  <circle class="p" cx="60" cy="56" r="7" fill="#FFF3D6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
